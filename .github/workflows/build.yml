# No ROM in CI, so no console builds here. This checks what can go wrong
# without one: every script parses, the target table is well formed, and
# launcher.json's pinned commits match the submodules (the installer
# downloads zips, which carry no submodules).
name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: for f in setup.sh scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: targets.tsv has 5 tab-separated fields per line
        run: |
          grep -v '^#' scripts/targets.tsv | awk -F'\t' 'NF != 5 { print "line " NR " has " NF " fields"; bad=1 } END { exit bad }'
      - run: python3 tools/check_launcher_pins.py
